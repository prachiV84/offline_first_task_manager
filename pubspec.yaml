name: task_manager_clean
description: Clean Architecture Flutter app with Cubit
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Dependency Injection
  get_it: ^7.6.4

  # Utilities
  intl: ^0.18.1
  uuid: ^4.3.3
  dartz: ^0.10.1 # For functional error handling

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  mockito: ^5.4.3
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
